# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
#
# D1 · Cỡ mẫu hai phía (baseline 0,70; alpha 0,05; power 0,80; ICC 0,02)
#   a) Chia theo yêu cầu, chênh 5 điểm %: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu, tức 42 người mỗi nhóm.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng luôn dưới 1.000.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng luôn dưới 300.
#   e) Chênh 6 điểm %: cần 859 yêu cầu hiệu dụng mỗi nhóm. Với 20 người mỗi
#      nhóm và 299 yêu cầu mỗi người, 5.980 yêu cầu thực tế / 6,96 = 859,20 hiệu dụng.
#
# D2 · Năm câu kiểm tra khả năng tách tác động
#   1. Đối chứng cùng thời gian: hai nhóm nhận yêu cầu cùng tuần tại các depot tham gia.
#   2. Ngẫu nhiên: phân theo staff_id, phân tầng theo depot, seed 13 và cân bằng tổng 20/20.
#   3. Ảnh hưởng gián tiếp: hạn chế chia sẻ gợi ý qua quyền truy cập và log theo staff_id.
#   4. Viết trước: khóa chỉ số chính, quy tắc phân tích, luật dừng và ngày quyết định trước khi mở pilot.
#   5. Số cụm: 20 nhân viên ở mỗi nhóm; mỗi nhân viên là một cụm.
#
# Đánh đổi: chọn chia theo nhân viên để giảm lan truyền tác động và nâng MDE
# từ 5 lên 6 điểm %. Nếu hiệu ứng thực tế chỉ 5 điểm %, power xấp xỉ 64%.
# An toàn: mở lại 7 ngày là 51/1.200 = 4,25% toàn mẫu và 39/982 = 3,97%
# trong phạm vi pilot. Dùng chênh lệch 2 điểm % so với đối chứng và trần 6%.
# Lịch giả định: mở pilot ngày 2026-12-01 sau Gate 2a. Xét bước rollout hằng tuần,
# dự kiến vào phân tích chính từ bước 50% ngày 2026-12-29. Khóa nhận mẫu
# cuối ngày 2027-01-24, chờ đủ cửa sổ đóng 24 giờ và theo dõi 7 ngày
# rồi quyết định ngày 2027-02-02.

pilot:
  owner: Giám đốc vận hành LogiX-VN
  scope: >-
    Chỉ xử lý yêu cầu noi_dia và hang_nang tại 12 depot để huy động đủ 40 nhân viên.
    Chi phí biến đổi là 0,22× và 0,69× mức nhân viên tự làm (simulated).
    Chuyển quoc_te (1,88×) và doi_tac (0,85×, điều khoản riêng) sang luồng thủ công
    (các tỷ số chi phí đều simulated).
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]  # 4, 10 rồi 20 nhân viên trong nhánh trợ lý
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859              # cỡ mẫu hiệu dụng, tương ứng 5.980 yêu cầu thực tế
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: >-
      20 nhân viên đối chứng giữ quy trình thường lệ suốt pilot. Bốc thăm theo
      staff_id trong từng depot với seed 13, chênh tối đa một người mỗi depot
      khi quân số lẻ và cân bằng tổng 20/20. Khóa danh sách phân nhóm và giữ
      quy tắc phân yêu cầu như nhau trong cả hai nhánh. Chốt trước thứ tự kích
      hoạt ngẫu nhiên trong nhánh trợ lý và áp dụng lịch 4, 10 rồi 20 người.
    spillover_risk: >-
      Nhân viên có thể chia sẻ gợi ý trong cùng depot. Cấp quyền theo tài khoản,
      yêu cầu giữ gợi ý trong nhánh trợ lý và log lượt mở bằng staff_id và trace_id.
    predeclared: >-
      So sánh tỷ lệ đóng trong 24 giờ mà không mở lại trong 7 ngày kể từ khi đóng,
      trên toàn bộ yêu cầu đủ điều kiện được giao từ bước 50%, theo nhánh đã phân.
      Người kiểm số báo cáo chênh lệch điểm phần trăm và kiểm định hai phía
      bằng hoán vị nhãn ở cấp nhân viên trong từng depot, giữ số người mỗi nhánh
      như lúc bốc thăm. Chỉ đề xuất mở rộng pilot nếu chênh lệch dương, p < 0,05,
      đủ 299 yêu cầu mỗi nhân viên theo giả định D1e và các ngưỡng an toàn,
      chi phí, sử dụng đều đạt. Dùng toàn bộ dữ liệu đủ điều kiện trong cửa sổ
      đã chốt. Nếu thiếu mẫu vào ngày khóa, báo cáo chưa đủ bằng chứng.
  stop_rules:
    - >-
      NẾU tỷ lệ mở lại của nhánh trợ lý cao hơn đối chứng từ 2 điểm % hoặc vượt 6%
      TRONG 3 ngày đánh giá liên tiếp, mỗi ngày dùng cửa sổ 7 ngày nhận yêu cầu
      đã đủ thời gian theo dõi ở cả hai nhánh, THÌ Giám đốc vận hành tắt trợ lý
      trong 30 phút và chuyển sang xử lý thủ công KHÔNG THÌ tiếp tục bước hiện tại
      và chỉ xét tăng rollout khi có đủ dữ liệu an toàn của bước đó.
    - >-
      NẾU phát hiện ít nhất 1 giao dịch hoàn phí trùng đã được xác nhận
      TRONG bất kỳ ngày nào của pilot THÌ Giám đốc vận hành tắt trợ lý trong
      30 phút và giao trưởng ca soát giao dịch KHÔNG THÌ duy trì giám sát từng ngày.
    - >-
      NẾU chi phí biến đổi mỗi việc thành công vượt 8.000 đ theo trace token/tool
      và số phút xem lại/làm lại ghi trong pilot
      TRONG 2 tuần liên tiếp THÌ PM giữ nguyên rollout, thu hẹp về noi_dia
      và giới hạn 2 lượt chạy; nếu đang trong cửa sổ phân tích chính, ghi nhận
      pilot ban đầu đã dừng trước khi đổi phạm vi KHÔNG THÌ giữ cấu hình hiện tại
      và chỉ xét tăng rollout khi các điều kiện khác cũng đạt.
    - >-
      NẾU tỷ lệ sửa hoặc bỏ gợi ý vượt 40% trong số yêu cầu đã xem lại
      TRONG 1 tuần có dữ liệu xem lại THÌ Trưởng nhóm CSKH giữ nguyên rollout
      và phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ tiếp tục theo dõi và
      chỉ xét tăng rollout khi các điều kiện khác cũng đạt.
  interim_looks: >-
    Theo dõi an toàn hằng ngày, chi phí và mức sử dụng hằng tuần để áp dụng
    luật dừng. Chỉ kiểm định chỉ số chính một lần vào ngày quyết định.
  rollback: >-
    Giám đốc vận hành tắt cờ trợ lý trong 30 phút, chặn lượt chạy mới và giao
    trưởng ca chuyển yêu cầu đang mở sang hàng đợi nhân viên xử lý thủ công.
  decision_date: "2027-02-02"
  simulated_inputs:
    - "A3: noi_dia 0,22×; hang_nang 0,69×; quoc_te 1,88×; doi_tac 0,85× (simulated)."
    - "Dữ liệu đợt chạy thử giả lập: mở lại 51/1.200 toàn mẫu và 39/982 trong phạm vi."
    - "Giả định thiết kế của lab: baseline 0,70 và ICC 0,02."
